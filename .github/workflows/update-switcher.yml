name: Update switcher.json

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - corneto_updated

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout switcher repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure assets/docs directory exists
        run: mkdir -p assets/docs

      - name: Run switcher generator
        run: |
          python scripts/generate_switcher.py \
            --repo-url https://github.com/saezlab/corneto.git \
            --base-url https://corneto.org \
            --output assets/docs/switcher.json

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/docs/switcher.json
          if git diff --cached --quiet; then
            echo "No changes to switcher.json"
          else
            git commit -m "chore: update assets/docs/switcher.json"
            git push
          fi
